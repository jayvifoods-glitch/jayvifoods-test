<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jayvi Foods — Admin Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 20%,#3a2416,#17110d 55%);display:grid;place-items:center;color:#eee8df;font-family:Arial,sans-serif}.loginCard{width:min(430px,92vw);background:#fffaf3;color:#251a13;padding:34px;border:1px solid #dccdb9;border-radius:12px;box-shadow:0 30px 80px #0008}.loginCard img{width:170px;height:60px;object-fit:contain;object-position:left;margin-bottom:18px}.eyebrow{font-size:9px;letter-spacing:2px;color:#a2781b;font-weight:800}.loginCard h1{font:600 42px Georgia;margin:10px 0}.loginCard p{font-size:11px;color:#786e65}.loginCard label{display:block;font-size:10px;font-weight:800;margin:14px 0}.loginCard input{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #d7c9b7;border-radius:6px;font-size:11px}.loginCard button{width:100%;border:0;border-radius:999px;background:#c99a2e;color:#1a1109;padding:13px;font-weight:800;margin-top:10px}.loginCard small{display:block;color:#8b8077;font-size:8px;line-height:1.5;margin:15px 0}.loginCard>a{font-size:9px;color:#8d6918;font-weight:800}.loginCard #err{color:#a14d3f;font-size:9px;margin-top:8px;min-height:12px}</style></head><body><main><div class="loginCard"><img src="images/brand/jayvi-foods-logo.webp" alt="Jayvi Foods"><div class="eyebrow">ADMIN PORTAL · V13 REVIEW</div><h1>Welcome back.</h1><p>Demo credentials are provided for this prototype only.</p><form onsubmit="login(event)"><label>Email<input id="email" type="email" value="admin@jayvifoods.com" required></label><label>Password<input id="password" type="password" value="JayviAdmin@2026" required></label><button>Sign in →</button></form><div id="err"></div><small>Prototype only — this login is for the current review prototype. Production admin authentication will be secured server-side.</small><a href="index.html">← Back to storefront</a></div></main><script>function login(e){e.preventDefault();if(email.value.trim().toLowerCase()==='admin@jayvifoods.com'&&password.value==='JayviAdmin@2026'){localStorage.setItem('jayviAdminSessionV8','active');location.href='admin.html'}else{err.textContent='Incorrect demo credentials.'}}</script></body></html>
