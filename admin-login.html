<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jayvi Foods — Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 15%,#3a2416,#17110d 60%);display:grid;place-items:center;color:#eee8df;font-family:'DM Sans',Arial,sans-serif;padding:24px}
.loginCard{width:min(420px,100%);background:#FBF6EE;color:#211712;padding:36px 30px;border:1px solid #e7dcc7;border-radius:22px;box-shadow:0 30px 80px #0008}
.loginCard img{width:150px;height:auto;object-fit:contain;object-position:left;margin-bottom:16px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:#9c3f1d;font-weight:800;text-transform:uppercase}
.loginCard h1{font:600 34px 'Fraunces',Georgia,serif;margin:10px 0}
.loginCard>p{font-size:13px;color:#5b4e43;line-height:1.5}
.loginCard label{display:block;font-size:12px;font-weight:700;margin:16px 0 6px;color:#5b4e43}
.loginCard input{display:block;width:100%;padding:13px 14px;border:1px solid #e7dcc7;border-radius:10px;font-size:15px;background:#fff}
.loginCard input:focus{outline:2px solid #C1552C;outline-offset:1px}
.loginCard button{width:100%;border:0;border-radius:999px;background:#C1552C;color:#fff;padding:14px;font-weight:800;font-size:14px;margin-top:16px;cursor:pointer}
.loginCard button:hover{background:#9C3F1D}
.loginCard small{display:block;color:#8b7d6e;font-size:11.5px;line-height:1.55;margin:16px 0}
.loginCard>a{font-size:12.5px;color:#9C3F1D;font-weight:700}
#err{color:#B23B2E;font-size:12px;margin-top:8px;min-height:14px;font-weight:600}
</style>
</head>
<body>
<main><div class="loginCard">
  <img src="images/brand/jayvi-foods-logo.webp" alt="Jayvi Foods">
  <div class="eyebrow">Admin Portal</div>
  <h1>Welcome back.</h1>
  <p>Sign in with your Jayvi Foods admin credentials.</p>
  <form onsubmit="login(event)" autocomplete="off">
    <label>Email<input id="email" type="email" required placeholder="you@jayvifoods.com" autocomplete="username"></label>
    <label>Password<input id="password" type="password" required placeholder="Enter password" autocomplete="current-password"></label>
    <button>Sign in →</button>
  </form>
  <div id="err"></div>
  <small>This admin panel runs entirely in the browser for this store build — data is stored on this device only. A backend-secured login should replace this before handling real customer traffic.</small>
  <a href="index.html">← Back to storefront</a>
</div></main>
<script>
  // Demo-only credential check for this static-site build. Unlike the
  // previous build, the credentials are no longer pre-filled into the form's
  // input values (anyone viewing page source previously saw the live admin
  // password). This is still a client-side-only check — replace with real
  // server-side auth before handling production traffic.
  function login(e){
    e.preventDefault();
    const email=document.getElementById('email').value.trim().toLowerCase();
    const password=document.getElementById('password').value;
    if(email==='admin@jayvifoods.com' && password==='JayviAdmin@2026'){
      localStorage.setItem('jayviAdminSessionV8','active');
      location.href='admin.html';
    }else{
      document.getElementById('err').textContent='Incorrect email or password.';
    }
  }
</script>
</body>
</html>
